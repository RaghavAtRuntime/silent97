name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --locked --extra mrp  # the text extra (PyTorch) is skipped in CI; tests needing it are skipped
      - name: Lint
        run: make lint
      - name: Test
        run: make test
