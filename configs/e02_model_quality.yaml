# E2: how much does model quality buy? (docs/PLAN.md, Experiments)
# Simulator, MCAR, signal strength swept so the realized model-outcome correlation
# runs from 0 to about 0.8; tabular labeler (LightGBM + isotonic) trained on a
# disjoint 5,000-customer split. 1,000 replicates per (strength, n).
name: e02_model_quality
seed: 20261013
population:
  n_customers: 200000
  target_nps: 20.0
labeler:
  n_train: 5000
  kind: tabular
  train_mechanism: mcar
scenarios:
  # Signal only, strength 0: the labeler sees pure noise, so rho is about 0.
  - {name: s000_noise, mechanism: mcar, signal_strength: 0.0, labeler_features: signal_only}
  # All labeler features (covariates + signal): covariates alone give rho of about 0.15.
  - {name: s000, mechanism: mcar, signal_strength: 0.0}
  - {name: s015, mechanism: mcar, signal_strength: 0.15}
  - {name: s030, mechanism: mcar, signal_strength: 0.3}
  - {name: s045, mechanism: mcar, signal_strength: 0.45}
  - {name: s060, mechanism: mcar, signal_strength: 0.6}
  - {name: s070, mechanism: mcar, signal_strength: 0.7}
  - {name: s080, mechanism: mcar, signal_strength: 0.8}
  - {name: s090, mechanism: mcar, signal_strength: 0.9}
  - {name: s095, mechanism: mcar, signal_strength: 0.95}
estimators: [classical, ppi, ppi_pp]
n_labeled: [100, 500]
replicates: 1000
alpha: 0.1
n_jobs: 4
