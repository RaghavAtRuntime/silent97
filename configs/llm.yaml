# Local LLM labeler settings (src/silent97/labelers/llm.py). Runs on CPU through
# Hugging Face transformers; nothing is sent to an external API and there is no
# spend. The weights download once from huggingface.co (needs network access).
model: Qwen/Qwen2.5-0.5B-Instruct   # Apache-2.0, 0.5B parameters
revision: null                      # pin a commit hash for byte-for-byte reproducibility
max_items: 10000                    # cumulative cap on items scored from this cache
max_input_tokens: 512               # longer prompts have the complaint text truncated
batch_size: 8
device: cpu
dtype: float32
threads: null                       # torch default
tokens_per_second: 450              # dry-run projection; measured for this architecture on 4 CPU cores
chars_per_token: 3.5
