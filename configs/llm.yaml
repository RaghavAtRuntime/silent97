# LLM labeler settings (src/silent97/labelers/llm.py).
# max_spend_usd is deliberately null: no API call is possible until a human sets a
# cap here. Prices are USD per million tokens for the chosen model; keep them in
# sync with the model (Opus 5.5: 4 / 20, Sonnet 5.5: 2 / 10, Haiku 5.5: 0.10 / 0.50).
model: claude-opus-5-5
effort: low
max_tokens: 2048
mode: batch            # Batches API: half price; sync mode is for small runs
max_items: 10000
max_spend_usd: null
price_input_per_mtok: 4.0
price_output_per_mtok: 20.0
batch_discount: 0.5
expected_output_tokens: 150
chars_per_token: 3.5
base_url: https://api.anthropic.com
batch_size: 2000
poll_seconds: 60
