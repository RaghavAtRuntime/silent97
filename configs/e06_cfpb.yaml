# E6: does it work on real text? (docs/PLAN.md, Experiments)
# CFPB complaints 2015..Apr 2017 with a narrative and a dispute value; the outcome
# is "disputed". Build the data first: `uv run python -m silent97.data.cfpb`.
name: e06_cfpb
seed: 20261014
data: data/processed/cfpb/cfpb.parquet
train_fraction: 0.2          # trains the tabular and embedding labelers
pool_size: 5000              # inference pool; the LLM labels exactly these (reviewer's choice)
labelers: [tabular, embedding, llm]
embedding_model: sentence-transformers/all-MiniLM-L6-v2
llm_config: configs/llm.yaml
estimators: [classical, naive_model, ppi, ppi_pp, ppi_crossfit]
n_labeled: [50, 100, 200, 500, 1000]
replicates: 1000
alpha: 0.1
crossfit_folds: 10
n_jobs: 4
cache_dir: cache
