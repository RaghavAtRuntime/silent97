[project]
name = "silent97"
version = "0.1.0"
description = "Valid confidence intervals for customer-base NPS from a small survey plus model predictions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silent97"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "slow: simulation-based tests (run with make test-slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Add "silent97.sampling.*" here when that package lands (Phase 4).
module = ["silent97.estimators.*"]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["silent97"]
branch = true
